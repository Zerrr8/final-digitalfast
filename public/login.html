<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin Login — LuthzzStore</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#0F172A,#1E293B)}
.card{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:32px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#2563EB,#7C3AED);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
h1{font-size:20px;color:#0F172A;margin-bottom:4px}p{font-size:13px;color:#64748B;margin-bottom:22px}
label{display:block;font-size:12px;font-weight:600;color:#334155;margin-bottom:6px}
input{width:100%;padding:12px 14px;border:1.5px solid #E2E8F0;border-radius:10px;font:inherit;font-size:14px;outline:none}
input:focus{border-color:#2563EB;box-shadow:0 0 0 3px #DBEAFE}
button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:#2563EB;color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}.err{color:#EF4444;font-size:12px;margin-top:10px;min-height:16px}
</style>
</head>
<body>
<form class="card" id="f">
  <div class="logo">L</div>
  <h1>Admin Dashboard</h1><p>Masukkan password untuk melanjutkan.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <button id="b" type="submit">Masuk</button>
  <div class="err" id="e"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e'); b.disabled = true; e.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
    const d = await r.json();
    if (r.ok) location.reload(); else { e.textContent = d.error || 'Gagal masuk'; b.disabled = false; }
  } catch { e.textContent = 'Tidak dapat terhubung ke server'; b.disabled = false; }
});
</script>
</body>
</html>
