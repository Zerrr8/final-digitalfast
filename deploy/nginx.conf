# Template Nginx untuk LuthzzStore. __DOMAIN__ diganti oleh setup-vps.sh.
# Certbot akan menambahkan blok HTTPS (443) + redirect secara otomatis.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Upload file produk dari admin (samakan dengan MAX_UPLOAD_MB di .env)
    client_max_body_size 210m;
    client_body_timeout 300s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Live chat realtime (Server-Sent Events): jangan di-buffer & jangan diputus
    location ~ ^/api/(chat|admin/chat)/stream$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Penting: IP asli + skema, dipakai rate-limit dan cookie Secure.
        # Nilai ditimpa (bukan ditambah) agar klien tidak bisa memalsukan IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server memercayai header ini untuk IP; kosongkan agar tidak bisa dipalsukan.
        proxy_set_header CF-Connecting-IP "";
        proxy_request_buffering off;   # upload file besar langsung diteruskan
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
